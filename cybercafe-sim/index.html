<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cybercafe Simulator</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #111a2b;
      --panel-2: #172338;
      --line: #2d3c5a;
      --text: #edf3ff;
      --muted: #91a5c8;
      --cyan: #4dd9ff;
      --green: #7ef7b3;
      --yellow: #ffd166;
      --orange: #ff8f5a;
      --red: #ff5d73;
      --purple: #b48cff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { overflow: hidden; }
    button { font: inherit; cursor: pointer; }
    .hidden { display: none !important; }
    #menu-screen, #game-screen {
      width: 100%; height: 100%;
    }
    #menu-screen {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(135deg, rgba(11,16,32,0.86), rgba(23,35,56,0.9)), url('cybercafe-sim/menu_bg.jpg') center/cover no-repeat;
      gap: 10px;
    }
    .menu-logo { font-size: 48px; }
    .menu-title { font-size: 34px; font-weight: 900; letter-spacing: 1px; background: linear-gradient(90deg, var(--cyan), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .menu-sub { color: var(--muted); margin-bottom: 12px; }
    .menu-id { background: rgba(17,26,43,0.8); padding: 8px 18px; border: 1px solid var(--line); border-radius: 10px; font-family: 'Courier New', monospace; }
    .menu-btn {
      width: min(320px, 78vw); padding: 16px 18px; border: 0; border-radius: 12px; font-weight: 800; font-size: 16px;
      transition: transform 0.15s ease;
    }
    .menu-btn.primary { background: linear-gradient(135deg, var(--green), var(--cyan)); color: #07111f; }
    .menu-btn.secondary { background: rgba(17,26,43,0.9); color: var(--cyan); border: 1px solid var(--cyan); }
    .menu-btn:hover { transform: translateY(-1px); }
    .menu-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .menu-footer { position: absolute; bottom: 18px; color: var(--muted); font-size: 12px; }

    #game-screen {
      display: flex; height: 100vh;
    }
    #left-panel {
      flex: 1.3; display:flex; flex-direction:column; border-right: 2px solid var(--line); background: var(--bg);
    }
    #shop-header { display:flex; align-items:center; justify-content:space-between; background: var(--panel); padding: 10px 12px; border-bottom: 1px solid var(--line); }
    #shop-name { font-weight: 800; }
    #shop-time { color: var(--yellow); font-weight: 700; }
    #shop-banner { background: var(--panel-2); padding: 6px 12px; display:flex; align-items:center; justify-content:center; gap:8px; border-bottom: 1px solid var(--line); }
    #shop-banner-name { color: var(--cyan); font-weight: 800; }
    #shop-banner-badges { display:flex; gap:4px; }
    .shop-badge { background: var(--panel); border: 1px solid var(--yellow); border-radius: 6px; padding: 2px 6px; }
    #shop-visual { flex:1; background: linear-gradient(180deg, rgba(17,26,43,0.95), rgba(12,16,28,0.95)); position: relative; padding: 8px; }
    #shop-floor { position:absolute; inset:8px; border-radius: 10px; background: repeating-linear-gradient(0deg, transparent, transparent 38px, rgba(77,217,255,0.04) 38px, rgba(77,217,255,0.04) 40px); }
    #pc-area { position:absolute; inset: 12px; display:grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; align-content: start; }
    .pc-slot {
      background: rgba(23,35,56,0.94); border: 2px solid var(--line); border-radius: 10px; min-height: 90px; padding: 6px; position: relative; cursor: pointer; transition: border-color 0.15s ease;
    }
    .pc-slot:hover { border-color: var(--cyan); }
    .pc-slot.empty { opacity: 0.5; border-style: dashed; }
    .pc-slot.waiting { border-color: var(--yellow); }
    .pc-slot.playing { border-color: var(--green); }
    .pc-slot.broken { border-color: var(--red); }
    .pc-num { color: var(--muted); font-size: 10px; font-weight: 700; }
    .pc-lv { display:inline-block; background: var(--purple); color: white; border-radius: 999px; padding: 2px 6px; font-size: 9px; }
    .pc-mon { font-size: 18px; margin-top: 2px; }
    .pc-gn { color: var(--cyan); font-size: 9px; height: 18px; overflow: hidden; }
    .pc-st { font-size: 9px; font-weight: 700; }
    .pc-st.free { color: var(--muted); }
    .pc-st.waiting { color: var(--yellow); }
    .pc-st.playing { color: var(--green); }
    .pc-st.broken { color: var(--red); }
    .pc-bar { height: 5px; background: rgba(255,255,255,0.08); border-radius: 999px; overflow:hidden; }
    .pc-bar-inner { height: 100%; background: linear-gradient(90deg, var(--green), var(--cyan)); width: 0; }
    .pc-type { position:absolute; top: 4px; right: 4px; border-radius: 4px; font-size: 8px; padding: 2px 4px; }
    .pc-type.vip { background: var(--yellow); color: #111; }
    .pc-type.student { background: var(--cyan); color: #111; }
    .pc-type.pro { background: var(--purple); color: white; }
    .pc-dialog { background: rgba(77,217,255,0.08); border:1px solid rgba(77,217,255,0.25); border-radius:4px; padding:2px 4px; font-size:8px; color: var(--cyan); margin-top: 3px; overflow:hidden; }
    #counter-area { background: var(--panel); border-top: 2px solid var(--line); padding: 8px 10px; display:flex; align-items:center; gap: 8px; }
    #counter-label { color: var(--muted); font-weight: 800; white-space: nowrap; }
    #queue-list { display:flex; gap: 6px; overflow-x: auto; flex: 1; min-height: 32px; align-items: center; }
    .q-cust { background: var(--panel-2); border: 1px solid var(--line); padding: 4px 8px; border-radius: 8px; font-size: 11px; white-space: nowrap; }
    .q-cust .badge { display:inline-block; background: rgba(255,255,255,0.05); border-radius: 4px; padding: 2px 5px; font-size: 9px; margin-left: 4px; }
    #serve-panel { position:absolute; left:0; right:0; bottom:0; background: rgba(17,26,43,0.97); border-top: 3px solid var(--yellow); padding: 16px; z-index: 10; }
    #sp-info { text-align:center; font-weight:700; }
    #sp-emoji { font-size: 32px; }
    #sp-hours { display:flex; align-items:center; justify-content:center; gap: 16px; margin: 12px 0; }
    .sp-btn { width: 56px; height: 56px; border-radius: 50%; background: var(--panel-2); border: 2px solid var(--line); color: white; font-size: 26px; }
    #sp-show { min-width: 80px; text-align: center; color: var(--cyan); font-weight: 900; font-size: 38px; }
    #sp-patience { height: 7px; background: rgba(255,255,255,0.08); border-radius: 99px; overflow:hidden; }
    #sp-pfill { width: 100%; height: 100%; background: linear-gradient(90deg, var(--green), var(--cyan)); transition: width 0.1s linear; }
    #sp-confirm { width: 100%; background: linear-gradient(135deg, var(--green), var(--cyan)); border: 0; border-radius: 10px; color: #07111f; padding: 14px; font-weight: 900; font-size: 16px; }

    #right-panel { flex: 0.9; max-width: 420px; display:flex; flex-direction:column; background: var(--panel); }
    #hud-bar { display:flex; gap: 6px; flex-wrap: wrap; padding: 8px 10px; background: var(--panel-2); border-bottom:1px solid var(--line); }
    .hud-item { background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-weight: 800; }
    .hud-item .hi { margin-right: 4px; }
    .owner-hud-box { width: 100%; background: rgba(255,255,255,0.03); border:1px solid var(--line); border-radius:8px; padding: 6px 8px; }
    .owner-hud-top { display:flex; justify-content: space-between; font-size: 12px; color: var(--purple); }
    .owner-exp-bar { margin-top: 4px; height: 6px; background: rgba(255,255,255,0.08); border-radius: 999px; overflow:hidden; }
    .owner-exp-fill { width: 0%; height:100%; background: linear-gradient(90deg, var(--purple), var(--cyan)); }
    #day-bar { background: var(--panel-2); padding: 6px 10px; border-bottom:1px solid var(--line); }
    #day-bar-fill { height: 6px; background: linear-gradient(90deg, var(--cyan), var(--purple)); border-radius: 99px; width: 0%; }
    #day-bar-txt { color: var(--muted); font-size: 11px; margin-top: 4px; }

    #tab-bar {
      display: flex; overflow-x:auto; gap: 4px; padding: 6px; background: var(--panel-2); border-bottom: 1px solid var(--line);
    }
    .tab-btn { background: transparent; border: none; color: var(--muted); padding: 8px 6px; min-width: 60px; border-bottom:2px solid transparent; font-weight:700; }
    .tab-btn.active { color: var(--cyan); border-bottom-color: var(--cyan); }
    #tab-content { flex:1; overflow:auto; padding: 8px; }
    .tab-panel { display:none; }
    .tab-panel.active { display:block; }
    .card { background: rgba(255,255,255,0.03); border:1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom:8px; }
    .card h3 { margin: 0 0 8px; font-size: 15px; }
    .card p { margin: 4px 0; color: var(--muted); font-size: 12px; }
    .row { display:flex; justify-content:space-between; align-items:center; gap: 10px; }
    .btn { width: 100%; padding: 10px 12px; border: none; border-radius: 8px; background: var(--green); color: #06121c; font-weight: 800; }
    .btn.secondary { background: var(--panel-2); color: var(--text); border:1px solid var(--line); }
    .btn.warn { background: var(--orange); color: #2a1209; }
    .mini { font-size: 11px; color: var(--muted); }
    .list { display:flex; flex-direction:column; gap:6px; }
    .list-row { display:flex; justify-content:space-between; align-items:center; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
    #bottom-bar { display:flex; gap: 4px; padding: 6px; background: var(--panel-2); border-top:1px solid var(--line); }
    #bottom-bar button { flex:1; min-width: 60px; background: rgba(255,255,255,0.03); color: var(--text); border:1px solid var(--line); border-radius:8px; padding: 8px 4px; font-weight:700; }
    .toast { position: fixed; left:50%; top: 72px; transform: translateX(-50%); background: rgba(32, 32, 40, 0.95); border:1px solid var(--line); color: var(--text); padding: 8px 14px; border-radius: 8px; font-weight:700; z-index: 999; opacity:0; animation: toast 2s ease; }
    @keyframes toast { 0% { opacity: 0; transform: translateX(-50%) translateY(-8px);} 15% { opacity: 1; } 85% { opacity: 1;} 100% { opacity: 0; transform: translateX(-50%) translateY(-2px);} }
    .danger { color: var(--red); }
  </style>
</head>
<body>
  <div id="menu-screen">
    <div class="menu-logo">🖥️</div>
    <div class="menu-title">CYBERCAFE SIMULATOR</div>
    <div class="menu-sub">Dari kedai buruk jadi esports arena</div>
    <div class="menu-id">🆔 ID: <span id="menu-id-display">CCS-XXXX</span></div>
    <button class="menu-btn primary" onclick="startNewGame()">🆕 MULA BERMAIN</button>
    <button class="menu-btn secondary" id="continue-btn" onclick="continueGame()" disabled>📂 CONTINUE</button>
    <div class="menu-footer">v4.0 — Bug fix + deploy ready</div>
  </div>

  <div id="game-screen" class="hidden">
    <div id="left-panel">
      <div id="shop-header">
        <div><span id="shop-deco">🏚️</span> <span id="shop-name">KEDAI PC ABU</span></div>
        <div id="shop-time">08:00</div>
      </div>
      <div id="shop-banner"><span id="shop-banner-name">🏪 KEDAI PC ABU</span><span id="shop-banner-badges"></span></div>
      <div id="shop-visual">
        <div id="shop-floor">
          <div id="pc-area"></div>
        </div>
      </div>
      <div id="counter-area">
        <div id="counter-label">🧑‍💼 KAUNTER</div>
        <div id="queue-list"></div>
      </div>
      <div id="serve-panel" class="hidden">
        <div id="sp-info"><div id="sp-emoji">🧑</div><div id="sp-text">Customer</div><div id="sp-ctype">NORMAL</div><div id="sp-request">Minta: 2 jam</div></div>
        <div id="sp-hours">
          <button class="sp-btn" id="sp-minus" onclick="adjustServeHours(-1)">−</button>
          <div id="sp-show">0</div>
          <button class="sp-btn" id="sp-plus" onclick="adjustServeHours(1)">+</button>
        </div>
        <div id="sp-patience"><div id="sp-pfill"></div></div>
        <button id="sp-confirm" onclick="confirmServe()">▶️ MULA MAIN</button>
      </div>
    </div>

    <div id="right-panel">
      <div id="hud-bar">
        <div class="hud-item"><span class="hi">💰</span><span id="money">RM 250</span></div>
        <div class="hud-item"><span class="hi">⭐</span><span id="rep">50</span></div>
        <div class="hud-item"><span class="hi">🎯</span><span id="day-goal">0/100</span></div>
        <div class="hud-item"><span class="hi">🔥</span><span id="combo">x1</span></div>
        <div class="owner-hud-box">
          <div class="owner-hud-top"><span id="owner-lvl-text">👔 Tauke Lv.1</span><span id="owner-exp-text">0/100 EXP</span></div>
          <div class="owner-exp-bar"><div id="owner-exp-fill" class="owner-exp-fill"></div></div>
        </div>
      </div>
      <div id="day-bar"><div id="day-bar-fill"></div><div id="day-bar-txt">Untung: RM 0 | Sewa: RM 25</div></div>

      <div id="tab-bar">
        <button class="tab-btn active" data-tab="pc" onclick="switchTab('pc')">🖥️ PC</button>
        <button class="tab-btn" data-tab="shop" onclick="switchTab('shop')">🏪 Kedai</button>
        <button class="tab-btn" data-tab="worker" onclick="switchTab('worker')">🤖 Staff</button>
        <button class="tab-btn" data-tab="ach" onclick="switchTab('ach')">🏆 Badge</button>
      </div>

      <div id="tab-content">
        <div id="tab-pc" class="tab-panel active"></div>
        <div id="tab-shop" class="tab-panel"></div>
        <div id="tab-worker" class="tab-panel"></div>
        <div id="tab-ach" class="tab-panel"></div>
      </div>

      <div id="bottom-bar">
        <button onclick="togglePause()">⏸️ Jeda</button>
        <button onclick="openShop()" id="open-shop-btn">🏪 Buka</button>
        <button onclick="saveGame()">💾 Simpan</button>
        <button onclick="backToMenu()">🏠 Menu</button>
      </div>
    </div>
  </div>

  <script>
    const SAVE_KEY = 'cybercafe-sim-v4';
    const ID_KEY = 'cybercafe-sim-id';
    const TUT_KEY = 'cybercafe-sim-tut';

    const SHOPS = [
      { name: 'Kedai Buruk', maxPC: 2, rent: 25, cost: 0, deco: '🏚️' },
      { name: 'Kedai Biasa', maxPC: 5, rent: 75, cost: 600, deco: '🏠' },
      { name: 'Cybercafe Kecil', maxPC: 10, rent: 250, cost: 3000, deco: '🏬' },
      { name: 'Cybercafe Sederhana', maxPC: 20, rent: 750, cost: 14000, deco: '🏢' },
      { name: 'Cybercafe Besar', maxPC: 35, rent: 2200, cost: 55000, deco: '🏪' },
      { name: 'Gaming Lounge', maxPC: 50, rent: 5500, cost: 220000, deco: '🎰' },
      { name: 'Esports Arena', maxPC: 50, rent: 12000, cost: 1200000, deco: '🏟️' }
    ];

    const CUSTOMER_TYPES = [
      { type: 'normal', emoji: '🧑', weight: 50, tipMult: 1, patience: 28 },
      { type: 'student', emoji: '🧑‍🎓', weight: 25, tipMult: 0.7, patience: 34 },
      { type: 'vip', emoji: '🤵', weight: 12, tipMult: 2.5, patience: 22 },
      { type: 'pro', emoji: '🧑‍💻', weight: 15, tipMult: 1.8, patience: 24 }
    ];

    const state = {
      money: 250,
      rep: 50,
      day: 1,
      shop: 1,
      ownerExp: 0,
      queue: [],
      pcs: [
        { id: 0, lv: 1, st: 'free', cust: null, hg: 0, hp: 0, cond: 100 },
        { id: 1, lv: 1, st: 'free', cust: null, hg: 0, hp: 0, cond: 100 }
      ],
      workers: [],
      sound: true,
      paused: true,
      dayClosed: true,
      combo: 1,
      dayProfit: 0,
      saveStamp: 0,
      nextCustomerId: 1,
      history: { served: 0, perfect: 0, angry: 0, totalEarn: 0 }
    };

    let curTab = 'pc';
    let serveTarget = null;
    let serveHours = 0;
    let lastTimestamp = 0;
    let tickAccumulator = 0;
    let customerSpawnTimer = 0;

    const defaultState = () => ({
      money: 250,
      rep: 50,
      day: 1,
      shop: 1,
      ownerExp: 0,
      queue: [],
      pcs: [
        { id: 0, lv: 1, st: 'free', cust: null, hg: 0, hp: 0, cond: 100 },
        { id: 1, lv: 1, st: 'free', cust: null, hg: 0, hp: 0, cond: 100 }
      ],
      workers: [],
      sound: true,
      paused: true,
      dayClosed: true,
      combo: 1,
      dayProfit: 0,
      saveStamp: 0,
      nextCustomerId: 1,
      history: { served: 0, perfect: 0, angry: 0, totalEarn: 0 }
    });

    function genID() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let out = 'CCS-';
      for (let i = 0; i < 5; i++) out += chars[Math.floor(Math.random() * chars.length)];
      return out;
    }
    function getID() {
      let id = localStorage.getItem(ID_KEY);
      if (!id) {
        id = genID();
        localStorage.setItem(ID_KEY, id);
      }
      return id;
    }
    function updateMenu() {
      document.getElementById('menu-id-display').textContent = getID();
      const saved = loadGame();
      document.getElementById('continue-btn').disabled = !saved;
    }

    function saveGame() {
      if (!state) return;
      state.saveStamp = Date.now();
      localStorage.setItem(SAVE_KEY, JSON.stringify(state));
      showToast('💾 Disimpan');
    }

    function loadGame() {
      try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== 'object') return null;
        const base = defaultState();
        const next = { ...base, ...parsed };
        next.pcs = Array.isArray(parsed.pcs) && parsed.pcs.length ? parsed.pcs.map((pc, i) => ({ id: i, lv: pc.lv || 1, st: pc.st || 'free', cust: pc.cust || null, hg: pc.hg || 0, hp: pc.hp || 0, cond: pc.cond || 100 })) : base.pcs;
        next.queue = Array.isArray(parsed.queue) ? parsed.queue : [];
        next.history = { ...base.history, ...(parsed.history || {}) };
        next.workers = Array.isArray(parsed.workers) ? parsed.workers : [];
        return next;
      } catch (e) {
        console.warn('Load failed', e);
        return null;
      }
    }

    function applyLoadedState() {
      const saved = loadGame();
      if (!saved) return;
      Object.assign(state, saved);
      if (!state.pcs || !state.pcs.length) state.pcs = defaultState().pcs;
      if (!state.history) state.history = defaultState().history;
      state.dayClosed = true;
      state.paused = true;
    }

    function resetState() {
      Object.assign(state, defaultState());
      state.dayClosed = true;
      state.paused = true;
      state.sound = true;
    }

    function showToast(msg) {
      let el = document.querySelector('.toast');
      if (el) el.remove();
      el = document.createElement('div');
      el.className = 'toast';
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2000);
    }

    function openShop() {
      state.dayClosed = false;
      state.paused = false;
      const btn = document.getElementById('open-shop-btn');
      if (btn) btn.textContent = '🏪 Buka';
      updateHUD();
      showToast('🏪 Kedai dibuka');
    }

    function backToMenu() {
      saveGame();
      document.getElementById('game-screen').classList.add('hidden');
      document.getElementById('menu-screen').classList.remove('hidden');
      updateMenu();
    }

    function startNewGame() {
      const old = loadGame();
      if (old && !confirm('Ada save lama. Ganti baru?')) return;
      resetState();
      localStorage.setItem(ID_KEY, genID());
      saveGame();
      document.getElementById('menu-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.remove('hidden');
      prepareGame();
      renderAll();
    }

    function continueGame() {
      const saved = loadGame();
      if (!saved) {
        showToast('❌ Tiada save');
        return;
      }
      Object.assign(state, saved);
      document.getElementById('menu-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.remove('hidden');
      prepareGame();
      renderAll();
    }

    function prepareGame() {
      lastTimestamp = performance.now();
      customerSpawnTimer = 0;
      renderAll();
      switchTab('pc');
      openShop();
    }

    function switchTab(name) {
      curTab = name;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.tab === name));
      document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.toggle('active', panel.id === `tab-${name}`));
      renderTab(name);
    }

    function renderTab(name) {
      const panel = document.getElementById(`tab-${name}`);
      if (!panel) return;
      if (name === 'pc') {
        panel.innerHTML = `
          <div class="card">
            <h3>📊 Ringkasan PC</h3>
            <p>Jumlah PC: ${state.pcs.length}</p>
            <p>PC siap: ${state.pcs.filter(p => p.st === 'free').length}</p>
            <p>PC main: ${state.pcs.filter(p => p.st === 'playing').length}</p>
          </div>
          <div class="card">
            <button class="btn" onclick="addPC()">+ Tambah PC</button>
          </div>
          <div class="card">
            <div class="list">
              ${state.pcs.map((pc, i) => `
                <div class="list-row">
                  <div>PC ${i + 1}</div>
                  <div class="mini">Lv ${pc.lv}</div>
                  <button class="btn secondary" onclick="upgradePC(${i})">Upgrade</button>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }
      if (name === 'shop') {
        panel.innerHTML = `
          <div class="card">
            <h3>🏪 Kedai</h3>
            <p>Semasa: ${SHOPS[state.shop - 1].name}</p>
            <p>Max PC: ${SHOPS[state.shop - 1].maxPC}</p>
            <p>Sewa harian: RM ${SHOPS[state.shop - 1].rent}</p>
          </div>
          ${SHOPS.map((shop, idx) => {
            const unlocked = idx + 1 <= state.shop;
            const enabled = idx + 1 > state.shop && state.money >= shop.cost;
            return `
              <div class="card ${!unlocked ? 'locked' : ''}">
                <div class="row">
                  <div><strong>${shop.deco} ${shop.name}</strong></div>
                  <div class="mini">${shop.maxPC} PC</div>
                </div>
                <p>${shop.cost ? 'RM ' + shop.cost : 'Mulai'}</p>
                <button class="btn ${enabled ? '' : 'secondary'}" ${!enabled && !unlocked ? 'disabled' : ''} onclick="buyShop(${idx + 1})">${unlocked ? 'Sudah dibeli' : 'Beli'}</button>
              </div>
            `;
          }).join('')}
        `;
      }
      if (name === 'worker') {
        panel.innerHTML = `
          <div class="card">
            <h3>🤖 Staf</h3>
            <p>Staf aktif: ${state.workers.length}</p>
            <p>Staf auto servisan akan datang bila cukup duit.</p>
          </div>
        `;
      }
      if (name === 'ach') {
        const badges = [
          { label: '💰 RM 1000', ok: state.money >= 1000 },
          { label: '⭐ Rep 80', ok: state.rep >= 80 },
          { label: '✅ 10 served', ok: state.history.served >= 10 },
          { label: '🌟 5 perfect', ok: state.history.perfect >= 5 },
          { label: '📈 Hari 3', ok: state.day >= 3 }
        ];
        panel.innerHTML = `
          <div class="card">
            <h3>🏆 Badge</h3>
            <div class="list">
              ${badges.map(b => `<div class="list-row"><span>${b.label}</span><span>${b.ok ? '✅' : '⬜'}</span></div>`).join('')}
            </div>
          </div>
        `;
      }
    }

    function renderAll() {
      renderHUD();
      renderQueue();
      renderPCs();
      renderTab(curTab);
      renderShopBanner();
    }

    function renderHUD() {
      document.getElementById('money').textContent = `RM ${Math.floor(state.money)}`;
      document.getElementById('rep').textContent = state.rep;
      document.getElementById('day-goal').textContent = `${state.dayProfit}/100`;
      document.getElementById('combo').textContent = `x${state.combo}`;
      const info = getOwnerLevelInfo(state.ownerExp);
      document.getElementById('owner-lvl-text').textContent = `👔 Tauke Lv.${info.level}`;
      document.getElementById('owner-exp-text').textContent = `${info.currentExp}/${info.nextReq} EXP`;
      document.getElementById('owner-exp-fill').style.width = `${Math.min(100, (info.currentExp / info.nextReq) * 100)}%`;
      const dayBar = document.getElementById('day-bar-fill');
      dayBar.style.width = `${(state.day / 30) * 100}%`;
      document.getElementById('day-bar-txt').textContent = `Untung: RM ${Math.floor(state.dayProfit)} | Sewa: RM ${SHOPS[state.shop - 1].rent}`;
      document.getElementById('shop-time').textContent = formatTime();
      document.getElementById('shop-name').textContent = state.shopName || 'KEDAI PC ABU';
      document.getElementById('shop-banner-name').textContent = `🏪 ${state.shopName || 'KEDAI PC ABU'}`;
      const deco = SHOPS[state.shop - 1].deco || '🏚️';
      document.getElementById('shop-deco').textContent = deco;
    }

    function renderShopBanner() {
      const badges = document.getElementById('shop-banner-badges');
      badges.innerHTML = (state.selectedBadges || []).slice(0, 3).map(() => '<span class="shop-badge">🏅</span>').join('') || '<span class="mini">-</span>';
    }

    function getOwnerLevelInfo(exp) {
      let lvl = 1; let req = 100; let rem = exp;
      while (rem >= req) { rem -= req; lvl += 1; req = Math.floor(req * 1.3); }
      return { level: lvl, currentExp: rem, nextReq: req };
    }

    function addOwnerExp(n) {
      state.ownerExp += n;
      renderHUD();
    }

    function renderQueue() {
      const queue = document.getElementById('queue-list');
      queue.innerHTML = state.queue.map(c => `
        <div class="q-cust">
          <span>${c.emoji} ${c.name}</span>
          <span class="badge">${c.ctype}</span>
        </div>
      `).join('');
    }

    function renderPCs() {
      const area = document.getElementById('pc-area');
      area.innerHTML = '';
      for (let i = 0; i < state.pcs.length; i++) {
        const pc = state.pcs[i];
        const slot = document.createElement('div');
        slot.className = 'pc-slot ' + pc.st;
        slot.onclick = () => {
          if (pc.st === 'waiting') openServe(i);
        };
        const type = pc.cust && pc.cust.ctype ? pc.cust.ctype : '';
        slot.innerHTML = `
          <div class="pc-num">PC ${i + 1}</div>
          <div class="pc-lv">Lv ${pc.lv}</div>
          <div class="pc-mon">💵</div>
          <div class="pc-gn">${pc.cust ? (pc.cust.game || 'Game') : 'Idle'}</div>
          <div class="pc-st ${pc.st}">${pc.st}</div>
          <div class="pc-bar"><div class="pc-bar-inner" style="width:${getProgress(pc)}%"></div></div>
          ${type ? `<span class="pc-type ${type}">${type}</span>` : ''}
          ${pc.cust && pc.cust.dialog ? `<div class="pc-dialog">${pc.cust.dialog}</div>` : ''}
        `;
        area.appendChild(slot);
      }
    }

    function getProgress(pc) {
      if (pc.st === 'playing') return Math.max(0, Math.min(100, (pc.hp / Math.max(1, pc.hg)) * 100));
      if (pc.st === 'waiting') return 100;
      return 0;
    }

    function addPC() {
      if (state.pcs.length >= SHOPS[state.shop - 1].maxPC) {
        showToast('⚠️ Kedai penuh');
        return;
      }
      if (state.money < 180) {
        showToast('💸 Tak cukup duit');
        return;
      }
      state.money -= 180;
      const nextId = state.pcs.length;
      state.pcs.push({ id: nextId, lv: 1, st: 'free', cust: null, hg: 0, hp: 0, cond: 100 });
      renderAll();
      showToast(`🖥️ PC baru ditambah!`);
    }

    function upgradePC(index) {
      const pc = state.pcs[index];
      if (!pc) return;
      if (pc.st !== 'free') {
        showToast('⚠️ PC sedang digunakan');
        return;
      }
      const cost = Math.floor(95 * Math.pow(1.15, pc.lv - 1));
      if (state.money < cost) {
        showToast('💸 Tak cukup duit');
        return;
      }
      state.money -= cost;
      pc.lv += 1;
      addOwnerExp(12);
      renderAll();
      showToast(`⬆️ PC ${index + 1} naik ke Lv ${pc.lv}`);
    }

    function buyShop(targetShop) {
      const shop = SHOPS[targetShop - 1];
      if (!shop) return;
      if (targetShop <= state.shop) {
        state.shop = targetShop;
        renderAll();
        return;
      }
      if (state.money < shop.cost) {
        showToast('💸 Tunai tak cukup');
        return;
      }
      state.money -= shop.cost;
      state.shop = targetShop;
      renderAll();
      showToast(`🏪 ${shop.name} dibeli`);
    }

    function formatTime() {
      const minutes = Math.floor((state.day * 120 + (state.dayClosed ? 0 : (state.day * 120 / 2))) % 1440);
      const hour = Math.floor(minutes / 60) % 24;
      const min = minutes % 60;
      const suffix = hour >= 12 ? 'PM' : 'AM';
      const normalized = ((hour + 11) % 12) + 1;
      return `${String(normalized).padStart(2, '0')}:${String(min).padStart(2, '0')} ${suffix}`;
    }

    function randomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

    function pickCustomerType() {
      const total = CUSTOMER_TYPES.reduce((sum, item) => sum + item.weight, 0);
      let roll = Math.random() * total;
      for (const item of CUSTOMER_TYPES) {
        roll -= item.weight;
        if (roll <= 0) return item;
      }
      return CUSTOMER_TYPES[0];
    }

    function spawnCustomer() {
      if (state.dayClosed || state.paused) return;
      if (state.queue.length >= 8) return;
      const type = pickCustomerType();
      const hours = randomInt(1, 6);
      const cust = {
        id: state.nextCustomerId++,
        name: ['Mat', 'Ali', 'Aisyah', 'Samy', 'Johan', 'Lina', 'Lim', 'Raju', 'Mira', 'Zul'][randomInt(0, 9)],
        emoji: type.emoji,
        ctype: type.type,
        wh: hours,
        patience: type.patience,
        maxPatience: type.patience,
        tipMult: type.tipMult,
        dialog: `${hours} jam please`,
        game: 'Game' + randomInt(1, 99)
      };
      state.queue.push(cust);
      renderQueue();
      assignQueue();
    }

    function assignQueue() {
      if (state.queue.length === 0) return;
      const freePC = state.pcs.find(pc => pc.st === 'free');
      if (!freePC) return;
      const c = state.queue.shift();
      freePC.st = 'waiting';
      freePC.cust = c;
      freePC.cust.dialog = `${c.name}: ${c.wh} jam`;
      renderQueue();
      renderPCs();
    }

    function openServe(index) {
      const pc = state.pcs[index];
      if (!pc || pc.st !== 'waiting' || !pc.cust) return;
      serveTarget = pc;
      serveHours = 0;
      document.getElementById('serve-panel').classList.remove('hidden');
      document.getElementById('sp-emoji').textContent = pc.cust.emoji;
      document.getElementById('sp-text').textContent = `${pc.cust.name} @ PC ${index + 1}`;
      document.getElementById('sp-ctype').textContent = pc.cust.ctype.toUpperCase();
      document.getElementById('sp-ctype').className = `sp-ctype ${pc.cust.ctype}`;
      document.getElementById('sp-request').textContent = `Minta: ${pc.cust.wh} jam`;
      document.getElementById('sp-show').textContent = '0';
      document.getElementById('sp-pfill').style.width = '100%';
    }

    function closeServe() {
      document.getElementById('serve-panel').classList.add('hidden');
      serveTarget = null;
      serveHours = 0;
    }

    function adjustServeHours(amount) {
      if (!serveTarget) return;
      serveHours = Math.max(0, Math.min(20, serveHours + amount));
      document.getElementById('sp-show').textContent = String(serveHours);
    }

    function confirmServe() {
      if (!serveTarget) return;
      if (serveHours <= 0) { showToast('⚠️ Pilih jam dulu'); return; }
      const pc = serveTarget;
      const request = pc.cust.wh;
      const diff = serveHours - request;
      const inc = 1.8 + (pc.lv - 1) * 0.45;
      let payout = 0;
      let repChange = 0;
      let mood = 'orange';
      let text = '';

      if (diff === 0) {
        payout = inc * request * (1 + 0.2 * (pc.cust.tipMult || 1));
        repChange = 1;
        mood = 'green';
        text = `✅ PERFECT! +RM ${payout.toFixed(2)}`;
        state.history.perfect += 1;
        addOwnerExp(25);
      } else if (Math.abs(diff) === 1) {
        payout = inc * request * (1 + 0.05 * (pc.cust.tipMult || 1));
        repChange = 0;
        mood = 'orange';
        text = `👌 OK! +RM ${payout.toFixed(2)}`;
        addOwnerExp(14);
      } else if (diff > 1) {
        payout = inc * request;
        repChange = -1;
        mood = 'orange';
        text = `💸 Lebih jam, pendapatan rendah +RM ${payout.toFixed(2)}`;
        addOwnerExp(6);
      } else {
        payout = inc * Math.max(1, serveHours);
        repChange = -3;
        mood = 'red';
        text = `😡 Customer marah! -Rep`;
        state.history.angry += 1;
        addOwnerExp(2);
      }

      state.money += payout;
      state.rep = Math.max(0, Math.min(100, state.rep + repChange));
      state.history.served += 1;
      state.history.totalEarn += payout;
      state.dayProfit += payout;
      state.combo = Math.max(1, state.combo + (diff === 0 ? 1 : 0));
      pc.st = 'playing';
      pc.hg = serveHours;
      pc.hp = 0;
      pc.cust.game = `Game ${randomInt(1, 99)}`;
      pc.cust.dialog = 'Main game...';
      closeServe();
      renderAll();
      showToast(text);
    }

    function updatePatience(dt) {
      if (state.dayClosed || state.paused) return;
      for (const pc of state.pcs) {
        if (pc.st === 'waiting' && pc.cust) {
          pc.cust.patience -= dt * 1.5;
          if (pc.cust.patience <= 0) {
            pc.st = 'free';
            pc.cust = null;
            state.rep = Math.max(0, state.rep - 5);
            renderAll();
          }
        }
      }
    }

    function updatePlaying(dt) {
      if (state.dayClosed || state.paused) return;
      for (const pc of state.pcs) {
        if (pc.st === 'playing') {
          pc.cond = Math.max(0, pc.cond - (dt * (0.4 + pc.lv * 0.02)));
          const secPerHour = 8 + (pc.hg * 0.6);
          pc.hp += dt / secPerHour;
          if (pc.hp >= pc.hg) {
            pc.st = 'free';
            pc.cust = null;
            pc.hg = 0;
            pc.hp = 0;
            assignQueue();
          }
        }
      }
    }

    function tick(dt) {
      if (state.dayClosed || state.paused) return;
      customerSpawnTimer += dt;
      if (customerSpawnTimer >= 4) {
        customerSpawnTimer = 0;
        spawnCustomer();
      }
      updatePatience(dt);
      updatePlaying(dt);
      state.money += (state.shop > 0 ? SHOPS[state.shop - 1].rent * dt * 0.016 : 0);
      renderAll();
    }

    function togglePause() {
      if (state.dayClosed) {
        showToast('⚠️ Kedai belum dibuka');
        return;
      }
      state.paused = !state.paused;
      showToast(state.paused ? '⏸️ Dijeda' : '▶️ Meneruskan');
    }

    function loop(ts) {
      if (!lastTimestamp) lastTimestamp = ts;
      const dt = Math.min(0.12, (ts - lastTimestamp) / 1000);
      lastTimestamp = ts;
      tick(dt);
      requestAnimationFrame(loop);
    }

    function openGame() {
      document.getElementById('menu-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.remove('hidden');
      prepareGame();
      renderAll();
    }

    function boot() {
      updateMenu();
      applyLoadedState();
      renderAll();
      document.getElementById('menu-screen').classList.remove('hidden');
      requestAnimationFrame(loop);
    }

    window.addEventListener('load', boot);
  </script>
</body>
</html>
